appId: com.fandazi.app
---
# 同一句同时查询本人订单与退款规则；最终必须包含两条真实读取事实，且复合进度结束。
- runFlow: flows/intent13-login.yaml
- runFlow:
    file: flows/refund-greeting-send.yaml
    env:
      CHAT_TEXT: 查询我的团购订单，另外告诉我团购券退款规则。
- extendedWaitUntil:
    visible: ".*未核销.*退款.*|.*退款.*未核销.*"
    timeout: 120000
- scrollUntilVisible:
    element:
      text: ".*查询到 0 条订单记录.*"
    direction: UP
    timeout: 30000
    centerElement: true
- assertNotVisible: 任务进度
- assertNotVisible: 处理进度
- takeScreenshot: intent13-b2-composite-two-read-goals

# 真实接口回复后隐藏进度，离页返回也不复活历史步骤；账号凭据由环境注入。
# 独立空账号只运行问候和可退款券查询，不提交退款、投诉或支付。
appId: com.fandazi.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "com.fandazi.app:id/username_input"
    timeout: 60000
- tapOn:
    id: "com.fandazi.app:id/username_input"
- eraseText
- setClipboard: "${MAESTRO_USERNAME}"
- pasteText
- tapOn:
    id: "com.fandazi.app:id/password_input"
- eraseText
- setClipboard: "${MAESTRO_PASSWORD}"
- pasteText
- hideKeyboard
- tapOn:
    id: "com.fandazi.app:id/submit_button"
- extendedWaitUntil:
    visible:
      id: "com.fandazi.app:id/bottom_navigation"
    timeout: 30000
- tapOn:
    id: "com.fandazi.app:id/agentAssistantTab"
- tapOn:
    id: "com.fandazi.app:id/agent_chat_input"
- setClipboard: "你好"
- pasteText
# 键盘会改变发送按钮坐标；先确认草稿并等待布局稳定，再确认点击确实清空了输入框。
- assertVisible:
    id: "com.fandazi.app:id/agent_chat_input"
    text: "你好"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "com.fandazi.app:id/agent_chat_send"
- extendedWaitUntil:
    notVisible:
      id: "com.fandazi.app:id/agent_chat_input"
      text: "你好"
    timeout: 10000
- extendedWaitUntil:
    visible: "你好，我是饭搭子助手。"
    timeout: 60000
# 回复后键盘已稳定显示，单次返回只收起键盘，避免hideKeyboard重复返回离开聊天。
- back
- assertVisible:
    id: "com.fandazi.app:id/agent_chat_input"
- assertNotVisible: "处理进度"
- assertNotVisible: "任务进度"
- takeScreenshot: "greeting-no-completed-progress"
- tapOn:
    id: "com.fandazi.app:id/agent_chat_input"
- setClipboard: "我要退款"
- pasteText
- assertVisible:
    id: "com.fandazi.app:id/agent_chat_input"
    text: "我要退款"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "com.fandazi.app:id/agent_chat_send"
- extendedWaitUntil:
    notVisible:
      id: "com.fandazi.app:id/agent_chat_input"
      text: "我要退款"
    timeout: 10000
- extendedWaitUntil:
    visible: "当前没有可申请退款的团购券"
    timeout: 60000
- back
- assertVisible:
    id: "com.fandazi.app:id/agent_chat_input"
- assertNotVisible: "处理进度"
- assertNotVisible: "任务进度"
- takeScreenshot: "refund-query-no-completed-progress"
- tapOn:
    id: "com.fandazi.app:id/homeFragment"
- tapOn:
    id: "com.fandazi.app:id/agentAssistantTab"
- extendedWaitUntil:
    visible: "当前没有可申请退款的团购券"
    timeout: 30000
- assertNotVisible: "处理进度"
- assertNotVisible: "任务进度"
- assertVisible: "你好，我是饭搭子助手。"
- takeScreenshot: "return-no-historical-progress"

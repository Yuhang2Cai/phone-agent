appId: com.fandazi.app
---
# 固定留出集逐类发送；每次清空客户端状态生成新会话，并等待第二个真实助手消息气泡。
# complaint 使用冻结的首条合成语句，不按运行结果更换问题。
- runFlow: flows/intent13-login.yaml
- runFlow:
    file: flows/refund-greeting-send.yaml
    env:
      CHAT_TEXT: "我要投诉松风食堂临时加价。"
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_message_text
      index: 1
    timeout: 120000
- assertNotVisible: 任务进度
- takeScreenshot: intent13-b2-label-complaint
# faq 使用冻结的首条合成语句，不按运行结果更换问题。
- runFlow: flows/intent13-login.yaml
- runFlow:
    file: flows/refund-greeting-send.yaml
    env:
      CHAT_TEXT: "团购订单能不能开具发票，说明平台规则。"
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_message_text
      index: 1
    timeout: 120000
- assertNotVisible: 任务进度
- takeScreenshot: intent13-b2-label-faq
# out_of_scope 使用冻结的首条合成语句，不按运行结果更换问题。
- runFlow: flows/intent13-login.yaml
- runFlow:
    file: flows/refund-greeting-send.yaml
    env:
      CHAT_TEXT: "帮我叫一辆网约车去餐厅。"
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_message_text
      index: 1
    timeout: 120000
- assertNotVisible: 任务进度
- takeScreenshot: intent13-b2-label-out_of_scope

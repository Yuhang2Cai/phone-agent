# AG07-08 唯一真实旅程前七输入：指代、任务切换、确认失效、新确认和业务回读。
# 登录与空会话绑定由外层驱动完成；所有业务请求均走真实 Android→Spring→Agent→MySQL 链路。
appId: com.fandazi.app
---
# 会话绑定前客户端可能已读到404；只读冷启动重载同一会话，不清状态、不重发旧业务。
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agentAssistantTab
    timeout: 30000
- tapOn:
    id: com.fandazi.app:id/agentAssistantTab
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_chat_input
    timeout: 30000
# 真实列表只有一个套餐；“这个套餐”应解析到当前唯一展示对象。
- runFlow:
    file: ../../android-app/maestro/flows/ag03-send.yaml
    env:
      CHAT_TEXT: 查询门店${AG07_STORE_ID}的团购套餐
# 首个在线请求必须返回真实套餐卡，失败就在这里停止后续付费原句。
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_deal_card
    timeout: 180000
- runFlow:
    file: ../../android-app/maestro/flows/ag03-send.yaml
    env:
      CHAT_TEXT: 查询这个套餐的详情
- extendedWaitUntil:
    visible: 已读取指定套餐，未提供的使用规则不能据此推断。
    timeout: 180000
- takeScreenshot: ag07-live-coreference
# 当前代码必须把自有订单集合查询识别为独立查询并实际返回订单卡。
- runFlow:
    file: ../../android-app/maestro/flows/ag03-send.yaml
    env:
      CHAT_TEXT: 先查下我的订单
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_order_card
    timeout: 180000
- assertNotVisible: 请说明新请求的对象和要查询或办理的事项。
- takeScreenshot: ag07-live-order-readback
# 准备购买后纠正数量，暂停必须使旧确认失效，恢复本身不得自动重新授权。
- runFlow:
    file: ../../android-app/maestro/flows/ag03-send.yaml
    env:
      CHAT_TEXT: 购买套餐${AG07_DEAL_ID}，数量1份
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_order_action
      text: 确认
      enabled: true
    timeout: 180000
- runFlow:
    file: ../../android-app/maestro/flows/ag03-send.yaml
    env:
      CHAT_TEXT: 改成2份
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_order_action
      text: 确认
      enabled: true
    timeout: 180000
- tapOn:
    id: com.fandazi.app:id/agent_task_primary_action
    text: 暂停
# 本旅程只有一个暂停对象，既有设计显示恢复卡；多个对象才进入歧义选择。
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_task_primary_action
      text: 恢复任务
      enabled: true
    timeout: 30000
- assertVisible:
    text: 旧确认已失效
    enabled: false
- takeScreenshot: ag07-live-old-disabled
# 显式打开目录后选择原任务，不按歧义页或关闭聊天的假设继续。
- tapOn:
    id: com.fandazi.app:id/agent_task_list_action
    text: 任务列表
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_task_list_title
      text: 任务列表 · 已暂停 1 项
    timeout: 30000
- tapOn:
    id: com.fandazi.app:id/agent_task_item_resume
    below:
      id: com.fandazi.app:id/agent_task_item_title
      text: 团购订单
    index: 0
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_task_primary_action
      text: 暂停
      enabled: true
    timeout: 30000
- assertVisible:
    text: 旧确认已失效
    enabled: false
- takeScreenshot: ag07-live-resumed-old-disabled
# 再次明确数量才生成新确认；点击一次后由数据库核对唯一订单，界面无需依赖长历史中的卡片位置。
- runFlow:
    file: ../../android-app/maestro/flows/ag03-send.yaml
    env:
      CHAT_TEXT: 改成2份
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_order_action
      text: 确认
      enabled: true
    timeout: 180000
- takeScreenshot: ag07-live-fresh-confirmation
- tapOn:
    id: com.fandazi.app:id/agent_order_action
    text: 确认
    enabled: true
- extendedWaitUntil:
    notVisible:
      id: com.fandazi.app:id/agent_progress_card
    timeout: 180000
# 进度卡消失也可能是429/503失败；必须看见当前待支付订单卡才允许发后续退款输入。
# 此断言只阻止继续，最终唯一写仍须数据库回读；不把UI订单卡代替业务事实。
# 建单返回支付授权时，实际停在“确认模拟支付”；先核服务驱动的待支付订单卡。
# 金额/唯一执行仍由父驱动账本核验，不能再点击支付确认。
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_order_meta
      text: "待支付.*"
    timeout: 30000
- assertVisible:
    id: com.fandazi.app:id/agent_order_action
    text: 查看订单
- assertNotVisible: 本次执行暂不可用，请稍后再试；已有任务进度保留
# 切换到退款任务并停在原因输入，不确认退款，保证写入边界只含一笔订单。
- runFlow:
    file: ../../android-app/maestro/flows/ag03-send.yaml
    env:
      CHAT_TEXT: 申请退款，券号${AG07_VOUCHER_ID}
- extendedWaitUntil:
    visible:
      id: com.fandazi.app:id/agent_task_status
      text: .*退款原因.*
    timeout: 180000
- takeScreenshot: ag07-live-task-switch


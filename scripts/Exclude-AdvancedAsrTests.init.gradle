import org.gradle.api.tasks.testing.Test
allprojects {
    tasks.withType(Test).configureEach {
        filter {
            excludeTestsMatching '*Asr*'
            excludeTestsMatching '*ASR*'
            excludeTestsMatching '*Speech*'
            excludeTestsMatching '*VoiceInput*'
            excludeTestsMatching '*asr*'
        }
    }
}

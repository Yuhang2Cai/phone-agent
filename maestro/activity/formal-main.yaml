# 正式主链路：先只读详情，明确领取后通过原生浏览、报价和模拟支付完成任务，最后手动领奖。
appId: com.fandazi.app
---
- tapOn: 今日下单 1 次，查看任务详情
- assertVisible: 领取后开始计算进度
- back
- assertVisible:
    text: 领取任务
    index: 0
- tapOn:
    text: 领取任务
    index: 0
- assertVisible: 去完成
- takeScreenshot: formal-accepted
- tapOn: 去完成
- assertVisible:
    id: com.fandazi.app:id/home_store_list
- tapOn:
    id: com.fandazi.app:id/deal_name
    index: 0
- tapOn:
    text: 抢购
    index: 0
- tapOn:
    id: com.fandazi.app:id/deal_purchase
- tapOn:
    id: com.fandazi.app:id/checkout_action
- assertVisible:
    id: com.fandazi.app:id/group_payment_action
- takeScreenshot: formal-unpaid
- tapOn:
    id: com.fandazi.app:id/group_payment_action
- assertVisible:
    id: com.fandazi.app:id/payment_success_title
- takeScreenshot: formal-paid
- tapOn:
    id: com.fandazi.app:id/payment_success_orders
- tapOn:
    id: com.fandazi.app:id/activityFragment
- assertVisible: 领取金币
- assertVisible: '0'
- takeScreenshot: formal-ready-no-auto-reward
- tapOn: 领取金币
- assertVisible: 金币已到账！
- takeScreenshot: formal-success
- tapOn:
    text: 查看金币明细
    index: 1
- assertVisible: 返回，金币明细
- assertVisible: '10'
- assertVisible: 任务奖励
- takeScreenshot: formal-ledger

# Task6 自然到期后操作：必须收到真实401再登录，并回到原套餐与数量的新报价，不提交旧授权。
appId: com.fandazi.app
---
- tapOn:
    id: "com.fandazi.app:id/checkout_action"
- extendedWaitUntil:
    visible:
      id: "com.fandazi.app:id/username_input"
    timeout: 30000
- assertNotVisible:
    id: "com.fandazi.app:id/checkout_action"
- tapOn:
    id: "com.fandazi.app:id/username_input"
- inputText: "${MAESTRO_USERNAME}"
- tapOn:
    id: "com.fandazi.app:id/password_input"
- inputText: "${MAESTRO_PASSWORD}"
- hideKeyboard
- tapOn:
    id: "com.fandazi.app:id/submit_button"
- extendedWaitUntil:
    visible: "提交订单"
    timeout: 30000
- assertVisible: "${TASK6_TOTAL}"
- assertVisible:
    id: "com.fandazi.app:id/checkout_quantity"
    text: "2"
- takeScreenshot: "401-login-return-original-quantity2"
# 回到套餐仅重新报价，没有自动创建订单；明确取消后应回到同一真实套餐详情。
- tapOn:
    id: "com.fandazi.app:id/checkout_close"
- assertVisible:
    id: "com.fandazi.app:id/deal_purchase_bar"
- takeScreenshot: "401-return-cancelled"

- runFlow: group-buying-03-purchase.yaml
- runFlow: group-buying-12-purchased-vouchers.yaml
# 同一购买账号的两券订单，退款只申请第一券，保留第二券供后续真实查询。
- runFlow: group-buying-05-refund.yaml
- runFlow: group-buying-05-refund-reentry.yaml
- runFlow: group-buying-05-agent-refund.yaml
- runFlow: group-buying-05-after-sale.yaml
- runFlow: group-buying-05-agent-orders-faq.yaml
- runFlow: group-buying-05-agent-composite.yaml
- runFlow:
    file: group-buying-05-review.yaml
    env:
      MAESTRO_USERNAME: ${REVIEW_USERNAME}
      MAESTRO_PASSWORD: ${REVIEW_PASSWORD}
- runFlow:
    file: group-buying-05-orders-empty.yaml
    env:
      MAESTRO_USERNAME: ${EMPTY_USERNAME}
      MAESTRO_PASSWORD: ${EMPTY_PASSWORD}
- runFlow:
    file: group-buying-05-agent-support.yaml
    env:
      MAESTRO_USERNAME: ${EMPTY_USERNAME}
      MAESTRO_PASSWORD: ${EMPTY_PASSWORD}
- runFlow: group-buying-02-agent-chat.yaml
- runFlow: group-buying-12-chat-cards.yaml
- runFlow: group-buying-10-memory.yaml
- runFlow: group-buying-10-memory-guest.yaml
- runFlow: group-buying-12-register.yaml

appId: com.fandazi.app
---
# 真实新Agent多轮退款：先取消确认，再重新准备并明确确认，仅消费一张剩余可退款券。
# 已完成的历史进度保留；暂停阶段只禁止进行中状态，不要求删除历史处理记录。
- runFlow: group-buying-05-login.yaml
- tapOn:
    id: "com.fandazi.app:id/agentAssistantTab"
- extendedWaitUntil:
    visible:
      id: "com.fandazi.app:id/agent_chat_input"
    timeout: 60000
- assertNotVisible: "进行中"
- assertNotVisible:
    id: "com.fandazi.app:id/agent_error_text"
- tapOn:
    id: "com.fandazi.app:id/agent_chat_input"
- setClipboard: "我想申请退款"
- pasteText
- hideKeyboard
- tapOn:
    id: "com.fandazi.app:id/agent_chat_send"
# 待选券是正常对话阶段，按钮必须由本人券列表动态生成。
- extendedWaitUntil:
    visible:
      text: "选择此券"
      enabled: true
    timeout: 30000
- takeScreenshot: "group-buying-agent-refund-choice"
- tapOn:
    text: "选择此券"
    enabled: true
- assertVisible: "选择券号末8位：.*"
- extendedWaitUntil:
    visible: ".*退款原因.*"
    timeout: 60000
- assertNotVisible: "进行中"
- tapOn:
    id: "com.fandazi.app:id/agent_chat_input"
- setClipboard: "行程变更"
- pasteText
- hideKeyboard
- tapOn:
    id: "com.fandazi.app:id/agent_chat_send"
# 准备阶段只读资格与签发凭证，不应自动写退款；确认卡必须出现真实摘要。
- extendedWaitUntil:
    visible:
      text: "确认退款"
      enabled: true
    timeout: 60000
- assertVisible: ".*金额：¥[0-9]+\\.[0-9]{2}.*"
- assertNotVisible: ".*confirmationGrant.*"
- assertNotVisible: "进行中"
- takeScreenshot: "group-buying-agent-refund-confirmation"
- tapOn:
    text: "取消本次申请"
    enabled: true
- extendedWaitUntil:
    visible: "已取消本次操作"
    timeout: 60000
- assertNotVisible:
    id: "com.fandazi.app:id/agent_order_action"
    enabled: true
- takeScreenshot: agent-refund-cancelled
# 取消不会退款；再次请求必须重新取得券、原因和准备摘要。
- tapOn:
    id: "com.fandazi.app:id/agent_chat_input"
- setClipboard: "我想申请退款"
- pasteText
- hideKeyboard
- tapOn:
    id: "com.fandazi.app:id/agent_chat_send"
- extendedWaitUntil:
    visible:
      text: "选择此券"
      enabled: true
    timeout: 60000
- tapOn:
    text: "选择此券"
    enabled: true
- extendedWaitUntil:
    visible: ".*退款原因.*"
    timeout: 60000
- tapOn:
    id: "com.fandazi.app:id/agent_chat_input"
- setClipboard: "行程变更"
- pasteText
- hideKeyboard
- tapOn:
    id: "com.fandazi.app:id/agent_chat_send"
- extendedWaitUntil:
    visible:
      text: "确认退款"
      enabled: true
    timeout: 60000
- tapOn:
    text: "确认退款"
    enabled: true
- extendedWaitUntil:
    visible: "退款申请已提交，正在等待处理。"
    timeout: 60000
- assertNotVisible:
    id: "com.fandazi.app:id/agent_order_action"
    enabled: true
- assertNotVisible: "进行中"
- assertNotVisible: ".*已到账.*"
- assertVisible:
    id: "com.fandazi.app:id/agent_chat_input"
- takeScreenshot: agent-refund-requested

# 测量准备流程：实际运行既有游客目录、筛选替换、20轮Tab；不录音、不请求ASR验证。
appId: com.fandazi.app
---
- launchApp:
    clearState: true
- tapOn:
    id: "com.fandazi.app:id/skip_login_button"
- extendedWaitUntil:
    visible:
      id: "com.fandazi.app:id/store_name"
    timeout: 30000
- takeScreenshot: baseline-home
- tapOn:
    id: "com.fandazi.app:id/category_hotpot"
- tapOn:
    id: "com.fandazi.app:id/category_drink"
- tapOn:
    id: "com.fandazi.app:id/category_recommend"
- extendedWaitUntil:
    visible:
      id: "com.fandazi.app:id/store_name"
    timeout: 30000
- repeat:
    times: 20
    commands:
      - tapOn:
          id: "com.fandazi.app:id/profileFragment"
      - tapOn:
          id: "com.fandazi.app:id/homeFragment"
      - extendedWaitUntil:
          visible:
            id: "com.fandazi.app:id/store_name"
          timeout: 15000
- takeScreenshot: baseline-tabs-returned

appId: com.fandazi.app
---
- launchApp:
    clearState: true
- tapOn:
    text: "Close app"
    optional: true
- tapOn:
    id: "com.fandazi.app:id/username_input"
- inputText: "maestro_ui_04"
- tapOn:
    id: "com.fandazi.app:id/password_input"
- inputText: "password123"
- pressKey: BACK
- tapOn:
    id: "com.fandazi.app:id/submit_button"
- extendedWaitUntil:
    visible:
      id: "com.fandazi.app:id/home_header_search"
    timeout: 10000
- tapOn:
    id: "com.fandazi.app:id/home_header_search"
- tapOn:
    id: "com.fandazi.app:id/home_search_button"
- tapOn:
    id: "com.fandazi.app:id/search_input"
- inputText: "盖饭"
- tapOn:
    id: "com.fandazi.app:id/search_button"
- extendedWaitUntil:
    visible: "饭搭子盖饭社"
    timeout: 30000
- tapOn: "饭搭子盖饭社"
- extendedWaitUntil:
    visible: "招牌辣椒鸡盖饭 1"
    timeout: 30000
- tapOn: "加入招牌辣椒鸡盖饭 1"

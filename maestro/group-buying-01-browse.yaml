appId: com.fandazi.app
---
# 清理应用状态，确保验收从登录页开始，不依赖开发机残留会话。
- launchApp:
    clearState: true
- assertVisible:
    id: "com.fandazi.app:id/skip_login_button"
- tapOn:
    id: "com.fandazi.app:id/skip_login_button"

# 验证 UI-01：首页具备位置、分类、排序和团购卡片，且游客可浏览。
- assertVisible:
    id: "com.fandazi.app:id/home_location"
- assertVisible:
    id: "com.fandazi.app:id/category_recommend"
- assertVisible:
    id: "com.fandazi.app:id/sort_average"
- assertVisible:
    id: "com.fandazi.app:id/store_name"

# 验证 UI-02：从首页进入搜索页，分类和筛选状态仍位于同一个浏览链路。
- tapOn:
    id: "com.fandazi.app:id/home_search_button"
- assertVisible:
    id: "com.fandazi.app:id/search_input"
- assertVisible:
    id: "com.fandazi.app:id/search_categories"
- assertVisible:
    id: "com.fandazi.app:id/filter_row"
- tapOn:
    id: "com.fandazi.app:id/search_back"

# 验证 UI-03 至 UI-05：门店详情只提供优惠、菜品、评价三个内容页签。
- tapOn:
    id: "com.fandazi.app:id/store_name"
    index: 0
- assertVisible:
    id: "com.fandazi.app:id/store_tab_deals"
- assertVisible:
    id: "com.fandazi.app:id/store_tab_dishes"
- assertVisible:
    id: "com.fandazi.app:id/store_tab_reviews"
- assertVisible:
    id: "com.fandazi.app:id/deal_title"
- tapOn:
    id: "com.fandazi.app:id/store_tab_dishes"
- assertVisible:
    id: "com.fandazi.app:id/dish_title"
- tapOn:
    id: "com.fandazi.app:id/store_tab_reviews"
- assertVisible:
    id: "com.fandazi.app:id/review_content"
- tapOn:
    id: "com.fandazi.app:id/store_tab_deals"

# 验证 UI-06：套餐详情存在规则、明细和固定购买入口，不出现旧外卖加购入口。
- tapOn:
    id: "com.fandazi.app:id/deal_title"
    index: 0
- assertVisible:
    id: "com.fandazi.app:id/deal_detail_list"
- assertVisible:
    id: "com.fandazi.app:id/deal_rule"
- assertVisible:
    id: "com.fandazi.app:id/deal_purchase"

# 团购工具契约：Spring 是业务事实、权限和确认的权威，新 Agent 仅可规划以下白名单。
# input 与 output.schema 是 JSON Schema Draft 7；output.type 保留 1.0 的结果类别标识以兼容目录读取。
schemaVersion: "1.1"
contractName: "fandazi-agent-tools"
$schema: "http://json-schema.org/draft-07/schema#"
endpoint: "POST /internal/v1/tools/{toolName}"

# 重试必须保留动作身份；写结果不确定时先查询事实，不能直接重复退款、支付或投诉。
idempotency:
  generatedBy: EXECUTOR
  components: [runId, taskId, actionVersion]
  verifyRequestFingerprint: true
  onUncertainWrite: QUERY_FACTS_BEFORE_RETRY
confirmationPolicy:
  field: confirmationGrantId
  issuedBy: SPRING
  boundTo: [userId, sessionId, action, resourceId, amountCents, ruleVersion, expiresAt]
  singleUse: true
  # 准备凭证不表示用户已同意；明确确认后还要重查资格、价格、版本与归属。
  explicitConfirmationBeforeBusinessWrite: true

fieldTypes:
  text: &text {type: string, minLength: 1}
  publicId: &publicId {type: string, minLength: 1, description: "Spring 返回的公开资源标识"}
  cents: &cents {type: integer, minimum: 0, description: "金额单位为整数分"}
  timestamp: &timestamp {type: string, format: date-time}
  date: &date {type: string, format: date}
  reason: &reason {type: string, minLength: 1, maxLength: 500}
  subject: &subject {type: string, minLength: 1, maxLength: 255}
  description: &description {type: string, minLength: 1, maxLength: 2000}
  # 图片既可保留历史完整 URL，也可使用审核过的本地版本化资源路径；其他相对路径不能绕过目录边界。
  catalogImageUrl: &catalogImageUrl
    oneOf:
      - {type: "null"}
      # URI插件缺失时format可能不检查；显式scheme使绝对URI与审核根路径仍互斥，避免oneOf误拒或放行任意相对路径。
      - {type: string, format: uri, pattern: '^[A-Za-z][A-Za-z0-9+.-]*:'}
      - {type: string, pattern: '^/catalog-images/v[0-9]+/(full|thumb)/[a-z0-9-]+-[a-f0-9]{12}\.jpg$'}

commonRequest:
  type: object
  additionalProperties: false
  required: [schemaVersion, userId, sessionId, traceId, runId, taskId, idempotencyKey, payload]
  properties:
    schemaVersion: {type: string, const: "1.1"}
    userId: *publicId
    sessionId: *publicId
    traceId: *text
    runId: *text
    taskId: *text
    idempotencyKey: *text
    actionVersion: {type: integer, minimum: 1, description: "执行器动作版本；未传时由执行器使用初始版本"}
    payload: {type: object, description: "按选定工具的 input schema 校验"}

commonResult:
  type: object
  additionalProperties: false
  required: [schemaVersion, ok, data, error]
  properties:
    schemaVersion: {type: string, const: "1.1"}
    ok: {type: boolean}
    data: {type: object, description: "成功时按 output.schema 校验，失败时为空对象"}
    error: {oneOf: [{$ref: "#/definitions/tool_error"}, {type: "null"}]}
  # 防止 ok=true 携带错误或失败时混入伪成功业务结果。
  allOf:
    - if: {properties: {ok: {const: true}}}
      then: {properties: {error: {type: "null"}}}
      else: {properties: {data: {type: object, maxProperties: 0}, error: {$ref: "#/definitions/tool_error"}}}
errorCodes: [VALIDATION_ERROR, NOT_FOUND, FORBIDDEN, CONFLICT, EXPIRED, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]

# 所有输出均保留已核对的业务 API 包装层；资源字段不强行与聊天卡片 DTO 混为一套。
definitions:
  tool_error:
    type: object
    additionalProperties: false
    required: [code, message, retryable]
    properties:
      code: {type: string, enum: [VALIDATION_ERROR, NOT_FOUND, FORBIDDEN, CONFLICT, EXPIRED, RATE_LIMITED, DEPENDENCY_UNAVAILABLE, INTERNAL_ERROR]}
      message: *text
      retryable: {type: boolean}
  store:
    type: object
    additionalProperties: false
    required: [publicId, name, brandName, cityCode, address, category, averageSpendCents, latitude, longitude, open, openingHours]
    properties:
      publicId: *publicId
      name: *text
      brandName: *text
      cityCode: *text
      address: *text
      category: *text
      averageSpendCents: *cents
      latitude: {type: number, minimum: -90, maximum: 90}
      longitude: {type: number, minimum: -180, maximum: 180}
      open: {type: boolean}
      openingHours: *text
      phone: {type: [string, "null"]}
      imageUrl: *catalogImageUrl
      # 图片缺失允许空值；替代文本来自目录事实，不由客户端拿其他餐品照片补齐。
      imageAlt: {type: [string, "null"]}
  deal:
    type: object
    additionalProperties: false
    required: [publicId, storeId, title, description, priceCents, originalPriceCents, inventory, validFrom, validTo, purchaseLimit]
    properties:
      publicId: *publicId
      storeId: *publicId
      title: *text
      description: {type: string}
      priceCents: *cents
      originalPriceCents: *cents
      inventory: {type: integer, minimum: 0}
      # 套餐有效日期是 LocalDate 业务事实，不伪造为带时区的时间点。
      validFrom: *date
      validTo: *date
      purchaseLimit: {type: integer, minimum: 1}
      active: {type: boolean}
      imageUrl: *catalogImageUrl
      imageAlt: {type: [string, "null"]}
  review:
    type: object
    additionalProperties: false
    required: [storeId, reviewerName, rating, content, createdAt]
    properties:
      storeId: *publicId
      reviewerName: *text
      rating: {type: number, minimum: 1, maximum: 5}
      content: *text
      createdAt: *timestamp
  voucher:
    type: object
    additionalProperties: false
    required: [publicId, orderId, dealId, dealTitle, storeId, storeName, status, canRefund, expiresAt, redeemedAt]
    properties:
      publicId: *publicId
      orderId: *publicId
      dealId: *publicId
      dealTitle: *text
      storeId: *publicId
      storeName: *text
      status: {type: string, enum: [UNUSED, REDEEMED, EXPIRED, REFUNDED]}
      canRefund: {type: boolean, description: "来自 Spring 资格判断，UNUSED 本身不足以推断可退款"}
      expiresAt: *timestamp
      redeemedAt: {type: [string, "null"], format: date-time}
      imageUrl: *catalogImageUrl
      imageAlt: {type: [string, "null"]}
      # 支付快照按券分摊；待支付券没有已付金额，不能把现价或零元当作可退款金额。
      amountCents: {type: [integer, "null"], minimum: 0}
      createdAt: *timestamp
  order:
    type: object
    additionalProperties: false
    required: [orderId, dealId, storeId, quantity, totalCents, status, voucherCount, createdAt, canReview, vouchers]
    properties:
      orderId: *publicId
      dealId: *publicId
      storeId: *publicId
      quantity: {type: integer, minimum: 1}
      totalCents: *cents
      status: {type: string, enum: [PENDING_PAYMENT, PAID, PARTIALLY_USED, USED, REFUNDED, EXPIRED, CANCELLED]}
      voucherCount: {type: integer, minimum: 0}
      createdAt: *timestamp
      canReview: {type: boolean, description: "由已核销事实与订单唯一评价记录计算"}
      vouchers: {type: array, items: {$ref: "#/definitions/voucher"}}
      storeName: *text
      dealTitle: *text
      imageUrl: *catalogImageUrl
      imageAlt: {type: [string, "null"]}
      # 只有 create_group_buy_order 成功输出签发以下内部支付字段；列表、详情、支付结果不补造凭证。
      # Agent 保存后另起明确支付确认；该凭证绑定 PAY_MOCK_ORDER、真实新订单与金额，购买凭证不能复用。
      paymentConfirmationGrantId: *text
      paymentConfirmationExpiresAt: *timestamp
      ruleVersion: {type: string, const: "pay-v1", description: "独立模拟支付确认规则"}
  coupon:
    type: object
    additionalProperties: false
    required: [couponId, claimId, name, status, thresholdCents, discountCents, validFrom, validTo, scopeDescription]
    properties:
      couponId: *publicId
      claimId: *publicId
      name: *text
      status: *text
      thresholdCents: *cents
      discountCents: *cents
      validFrom: *timestamp
      validTo: *timestamp
      scopeDescription: *text
  faq:
    type: object
    additionalProperties: false
    required: [id, question, answer]
    properties:
      id: *text
      question: *text
      answer: *text
  store_list:
    type: object
    additionalProperties: false
    required: [stores]
    properties:
      stores: {type: array, items: {$ref: "#/definitions/store"}}
  store_detail:
    type: object
    additionalProperties: false
    required: [store]
    properties:
      store: {$ref: "#/definitions/store"}
  deal_list:
    type: object
    additionalProperties: false
    required: [deals]
    properties:
      deals: {type: array, items: {$ref: "#/definitions/deal"}}
  deal_detail:
    type: object
    additionalProperties: false
    required: [deal]
    properties:
      deal: {$ref: "#/definitions/deal"}
  review_list:
    type: object
    additionalProperties: false
    required: [reviews]
    properties:
      reviews: {type: array, items: {$ref: "#/definitions/review"}}
  order_list:
    type: object
    additionalProperties: false
    required: [orders]
    properties:
      orders: {type: array, items: {$ref: "#/definitions/order"}}
  order_detail:
    type: object
    additionalProperties: false
    required: [order]
    properties:
      order: {$ref: "#/definitions/order"}
  voucher_list:
    type: object
    additionalProperties: false
    required: [vouchers]
    properties:
      vouchers: {type: array, items: {$ref: "#/definitions/voucher"}}
  coupon_list:
    type: object
    additionalProperties: false
    required: [coupons]
    properties:
      coupons: {type: array, items: {$ref: "#/definitions/coupon"}}
  faq_answer:
    type: object
    additionalProperties: false
    required: [faqs]
    properties:
      faqs: {type: array, items: {$ref: "#/definitions/faq"}}
  purchase_quote:
    type: object
    additionalProperties: false
    required: [quoteId, dealId, quantity, subtotalCents, discountCents, totalCents, expiresAt, confirmationGrantId, dealVersion]
    properties:
      quoteId: *publicId
      dealId: *publicId
      quantity: {type: integer, minimum: 1}
      subtotalCents: *cents
      discountCents: *cents
      totalCents: *cents
      expiresAt: *timestamp
      confirmationGrantId: *text
      dealVersion: {type: integer, minimum: 0}
      # 确认截止与报价截止独立保存，展示确认摘要仅使用确认凭证的实际期限。
      confirmationExpiresAt: *timestamp
      confirmationRuleVersion: *text
  refund_preparation:
    type: object
    additionalProperties: false
    required: [voucherId, orderId, dealTitle, amountCents, expiresAt, confirmationGrantId]
    properties:
      voucherId: *publicId
      orderId: *publicId
      dealTitle: *text
      amountCents: *cents
      # 申请页展示同一后端资源，不拼接静态门店、图片或退款资格。
      storeId: *publicId
      dealId: *publicId
      storeName: *text
      canRefund: {type: boolean}
      imageUrl: *catalogImageUrl
      imageAlt: {type: [string, "null"]}
      # 此处保留资格 API 的券有效期含义；确认凭证有效期由 Spring 内部记录，不能混用。
      expiresAt: *timestamp
      confirmationGrantId: *text
      # expiresAt 是券期限；这两个可选字段才描述本次退款确认的实际截止与规则。
      confirmationExpiresAt: *timestamp
      confirmationRuleVersion: *text
  complaint_preparation:
    type: object
    additionalProperties: false
    required: [orderId, confirmationGrantId]
    properties:
      # 允许未关联订单的投诉，空字符串表示无订单；内部凭证资源使用 general，不伪造订单 ID。
      orderId: {type: string}
      confirmationGrantId: *text
      # 未关联订单的投诉仍签发独立短时确认；准备不创建业务工单。
      confirmationExpiresAt: *timestamp
      confirmationRuleVersion: *text
  refund_result:
    type: object
    additionalProperties: false
    required: [requestId, voucherId, status, reason, createdAt]
    properties:
      requestId: *publicId
      voucherId: *publicId
      # 创建申请只进入 REQUESTED，COMPLETED 表示后续实际处理完成，不能混成 PENDING。
      status: {type: string, enum: [REQUESTED, APPROVED, REJECTED, COMPLETED]}
      reason: *reason
      createdAt: *timestamp
      amountCents: *cents
      # 进度摘要保留申请时关联与真实金额，REQUESTED 只是待处理，不表示到账。
      orderId: *publicId
      storeId: *publicId
      dealId: *publicId
      storeName: *text
      dealTitle: *text
      expiresAt: *timestamp
      # 退款结果沿用真实套餐餐图，允许历史完整URL与受控版本路径，任意相对路径仍拒绝。
      imageUrl: *catalogImageUrl
      imageAlt: {type: [string, "null"]}
  complaint_ticket:
    type: object
    additionalProperties: false
    required: [ticketId, status, subject, createdAt]
    properties:
      ticketId: *publicId
      status: {type: string, enum: [OPEN, PROCESSING, RESOLVED, CLOSED]}
      subject: *subject
      createdAt: *timestamp

# 每个工具都写清输入、成功数据、确认要求和副作用；身份来自 commonRequest 而不是模型 payload。
tools:
  - name: search_stores
    description: "按城市、降精度位置、品类、人均和排序查询门店"
    risk: READ_ONLY
    confirmationRequired: false
    businessCommitted: false
    sideEffects: []
    input:
      type: object
      additionalProperties: false
      required: [cityCode]
      properties:
        cityCode: *text
        latitude: {type: number, minimum: -90, maximum: 90}
        longitude: {type: number, minimum: -180, maximum: 180}
        category: *text
        minPriceCents: *cents
        maxPriceCents: *cents
        sort: {type: string, enum: [RECOMMENDED, PRICE_ASC, PRICE_DESC, DISTANCE]}
    output: {type: store_list, schema: {$ref: "#/definitions/store_list"}}
    errors: [VALIDATION_ERROR, NOT_FOUND, DEPENDENCY_UNAVAILABLE]
  - name: get_store_detail
    description: "查询公开门店详情，不公开数据库主键"
    risk: READ_ONLY
    confirmationRequired: false
    businessCommitted: false
    sideEffects: []
    input: {type: object, additionalProperties: false, required: [storeId], properties: {storeId: *publicId}}
    output: {type: store_detail, schema: {$ref: "#/definitions/store_detail"}}
    errors: [NOT_FOUND, FORBIDDEN, DEPENDENCY_UNAVAILABLE]
  - name: list_deal_packages
    description: "查询门店当前可售固定套餐，返回真实价格与库存"
    risk: READ_ONLY
    confirmationRequired: false
    businessCommitted: false
    sideEffects: []
    input:
      type: object
      additionalProperties: false
      required: [storeId]
      properties:
        storeId: *publicId
        sort: {type: string, enum: [RECOMMENDED, PRICE_ASC, PRICE_DESC]}
    output: {type: deal_list, schema: {$ref: "#/definitions/deal_list"}}
    errors: [NOT_FOUND, DEPENDENCY_UNAVAILABLE]
  - name: get_deal_detail
    description: "查询指定固定套餐及有效日期"
    risk: READ_ONLY
    confirmationRequired: false
    businessCommitted: false
    sideEffects: []
    input: {type: object, additionalProperties: false, required: [dealId], properties: {dealId: *publicId}}
    output: {type: deal_detail, schema: {$ref: "#/definitions/deal_detail"}}
    errors: [NOT_FOUND, EXPIRED, DEPENDENCY_UNAVAILABLE]
  - name: search_reviews
    description: "查询公开评价；评分范围与分页参数必须合法"
    risk: READ_ONLY
    confirmationRequired: false
    businessCommitted: false
    sideEffects: []
    input:
      type: object
      additionalProperties: false
      required: [storeId]
      properties:
        storeId: *publicId
        dealId: *publicId
        rating: {type: number, minimum: 1, maximum: 5}
        keyword: *text
        page: {type: integer, minimum: 0}
    output: {type: review_list, schema: {$ref: "#/definitions/review_list"}}
    errors: [VALIDATION_ERROR, NOT_FOUND, DEPENDENCY_UNAVAILABLE]
  - name: list_user_orders
    description: "查询可信会话用户的团购订单及券摘要，不能跨用户查询"
    risk: READ_ONLY
    confirmationRequired: false
    businessCommitted: false
    sideEffects: []
    input:
      type: object
      additionalProperties: false
      required: []
      properties:
        status: {type: string, enum: [PENDING_PAYMENT, PAID, PARTIALLY_USED, USED, REFUNDED, EXPIRED, CANCELLED]}
        page: {type: integer, minimum: 0}
    output: {type: order_list, schema: {$ref: "#/definitions/order_list"}}
    errors: [VALIDATION_ERROR, FORBIDDEN, DEPENDENCY_UNAVAILABLE]
  - name: get_order_detail
    description: "查询本人指定订单，返回金额快照与服务端评价资格"
    risk: READ_ONLY
    confirmationRequired: false
    businessCommitted: false
    sideEffects: []
    input: {type: object, additionalProperties: false, required: [orderId], properties: {orderId: *publicId}}
    output: {type: order_detail, schema: {$ref: "#/definitions/order_detail"}}
    errors: [NOT_FOUND, FORBIDDEN, DEPENDENCY_UNAVAILABLE]
  - name: list_user_vouchers
    description: "查询本人券公开摘要；不下发核销令牌，未支付订单不能推断可退款"
    risk: READ_ONLY
    confirmationRequired: false
    businessCommitted: false
    sideEffects: []
    input:
      type: object
      additionalProperties: false
      required: []
      properties:
        status: {type: string, enum: [UNUSED, REDEEMED, EXPIRED, REFUNDED]}
        orderId: *publicId
    output: {type: voucher_list, schema: {$ref: "#/definitions/voucher_list"}}
    errors: [VALIDATION_ERROR, FORBIDDEN, DEPENDENCY_UNAVAILABLE]
  - name: create_purchase_quote
    description: "校验库存、限购和价格，保存短期报价并签发购买确认凭证；不创建业务订单"
    risk: WRITE_PREVIEW
    confirmationRequired: false
    businessCommitted: false
    sideEffects: [persist_quote, issue_confirmation_grant, persist_audit]
    guards: &preparationGuards {authenticated: true, resourceOwnership: true, rateLimited: true, audited: true}
    input:
      type: object
      additionalProperties: false
      required: [dealId, quantity]
      properties:
        dealId: *publicId
        quantity: {type: integer, minimum: 1}
        couponId: *publicId
    output: {type: purchase_quote, schema: {$ref: "#/definitions/purchase_quote"}}
    errors: [VALIDATION_ERROR, NOT_FOUND, FORBIDDEN, CONFLICT, EXPIRED, RATE_LIMITED, DEPENDENCY_UNAVAILABLE]
  - name: prepare_refund
    description: "校验券归属和退款资格并签发短期凭证；不创建退款申请，不改变券状态"
    risk: WRITE_PREVIEW
    confirmationRequired: false
    businessCommitted: false
    sideEffects: [issue_confirmation_grant, persist_audit]
    guards: *preparationGuards
    input: {type: object, additionalProperties: false, required: [voucherId], properties: {voucherId: *publicId}}
    output: {type: refund_preparation, schema: {$ref: "#/definitions/refund_preparation"}}
    errors: [VALIDATION_ERROR, NOT_FOUND, FORBIDDEN, CONFLICT, EXPIRED, RATE_LIMITED, DEPENDENCY_UNAVAILABLE]
  - name: prepare_complaint
    description: "校验可选订单归属并签发投诉凭证；允许不关联订单，不创建投诉工单"
    risk: WRITE_PREVIEW
    confirmationRequired: false
    businessCommitted: false
    sideEffects: [issue_confirmation_grant, persist_audit]
    guards: *preparationGuards
    input: {type: object, additionalProperties: false, required: [], properties: {orderId: *publicId}}
    output: {type: complaint_preparation, schema: {$ref: "#/definitions/complaint_preparation"}}
    errors: [VALIDATION_ERROR, NOT_FOUND, FORBIDDEN, EXPIRED, RATE_LIMITED, DEPENDENCY_UNAVAILABLE]
  - name: create_group_buy_order
    description: "按报价快照校验数量、金额与版本，消费用户已确认的凭证后创建待支付订单"
    risk: WRITE
    confirmationRequired: true
    businessCommitted: true
    sideEffects: [consume_confirmation_grant, create_order, persist_audit]
    input:
      type: object
      additionalProperties: false
      required: [quoteId, confirmationGrantId]
      properties:
        quoteId: *publicId
        confirmationGrantId: *text
    # 与列表工具不同，写 API 返回直接订单摘要；适配器不能误包成外卖 order 对象。
    output: {type: order_detail, schema: {$ref: "#/definitions/order"}}
    errors: [VALIDATION_ERROR, NOT_FOUND, FORBIDDEN, CONFLICT, EXPIRED, DEPENDENCY_UNAVAILABLE]
  - name: pay_mock_order
    description: "校验本人待支付团购订单与支付确认凭证后执行幂等模拟支付"
    risk: WRITE
    confirmationRequired: true
    businessCommitted: true
    sideEffects: [consume_confirmation_grant, update_payment, persist_audit]
    input:
      type: object
      additionalProperties: false
      required: [orderId, confirmationGrantId]
      properties:
        orderId: *publicId
        confirmationGrantId: *text
        # 允许执行器显式传规则用于持久化恢复；服务仍固定校验 pay-v1，不接受模型自选版本。
        ruleVersion: {type: string, const: "pay-v1"}
    output: {type: payment_result, schema: {$ref: "#/definitions/order"}}
    errors: [VALIDATION_ERROR, NOT_FOUND, FORBIDDEN, CONFLICT, EXPIRED, DEPENDENCY_UNAVAILABLE]
  - name: request_refund
    description: "明确确认后重查退款资格，消费退款专属凭证并创建待处理申请；不冒充退款到账"
    risk: WRITE
    confirmationRequired: true
    businessCommitted: true
    sideEffects: [consume_confirmation_grant, create_refund_request, persist_audit]
    input:
      type: object
      additionalProperties: false
      required: [voucherId, reason, confirmationGrantId]
      properties:
        voucherId: *publicId
        reason: *reason
        confirmationGrantId: *text
